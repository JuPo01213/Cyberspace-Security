<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decision Questionnaire</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 880px; margin: 0 auto; padding: 32px 20px 56px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { opacity: .72; margin-bottom: 24px; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 14px; padding: 18px; margin: 14px 0; }
    .scenario { opacity: .76; margin: 8px 0 14px; line-height: 1.55; }
    label.option { display: block; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); border-radius: 10px; padding: 12px; margin: 8px 0; cursor: pointer; }
    label.option:has(input:checked) { border-color: AccentColor; outline: 1px solid AccentColor; }
    .badge { display: inline-block; font-size: 12px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; margin-left: 6px; opacity: .8; }
    .reason { opacity: .66; font-size: 13px; margin: 6px 0 0 24px; }
    textarea { width: 100%; min-height: 76px; box-sizing: border-box; margin-top: 8px; padding: 10px; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); font: inherit; }
    .actions { position: sticky; bottom: 0; padding: 16px 0; background: linear-gradient(transparent, Canvas 24%); display: flex; gap: 10px; align-items: center; }
    button { font: inherit; padding: 10px 16px; border-radius: 9px; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); cursor: pointer; }
    button.primary { background: AccentColor; color: AccentColorText; border-color: AccentColor; }
    #result { white-space: pre-wrap; word-break: break-word; padding: 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 14%, transparent); display: none; }
    .muted { opacity: .62; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <form id="form"></form>
  <div class="actions">
    <button class="primary" id="submit" type="button">一次提交全部决定</button>
    <span class="muted">推荐项已默认选中；只修改你不同意或不确定的地方。</span>
  </div>
  <pre id="result"></pre>
</main>
<script>
const QUESTIONNAIRE = {
  id: "example-frontier-01",
  title: "这轮只确认真正影响使用方式的决定",
  intro: "模型已经给出默认推荐。你只需要修改不同意的项，或者标记“不确定”。",
  questions: [
    {
      id: "document-opening",
      question: "打开第二个文件时，第一个文件怎么办？",
      scenario: "例如你正在编辑 A，又打开 B。这个决定会影响你是否能同时对照多个文件。",
      recommended: "single",
      recommendation_reason: "第一版更简单，状态更清楚；如果以后确实需要对照多个文件再扩展。",
      options: [
        { value: "single", label: "一次只处理一个" },
        { value: "multiple", label: "同时打开多个" }
      ]
    },
    {
      id: "overwrite",
      question: "导出同名文件时怎么办？",
      scenario: "如果目标目录已经有同名文件，需要决定新结果如何落盘。",
      recommended: "ask",
      recommendation_reason: "先询问可以降低误覆盖旧文件的风险。",
      options: [
        { value: "ask", label: "覆盖前先询问" },
        { value: "rename", label: "自动加序号" },
        { value: "overwrite", label: "直接覆盖" }
      ]
    }
  ]
};

const form = document.getElementById('form');
document.getElementById('title').textContent = QUESTIONNAIRE.title;
document.getElementById('intro').textContent = QUESTIONNAIRE.intro;

for (const q of QUESTIONNAIRE.questions) {
  const card = document.createElement('section');
  card.className = 'card';
  const h = document.createElement('h2');
  h.textContent = q.question;
  h.style.fontSize = '18px';
  h.style.margin = '0';
  card.appendChild(h);
  const scenario = document.createElement('p');
  scenario.className = 'scenario';
  scenario.textContent = q.scenario;
  card.appendChild(scenario);

  for (const opt of q.options) {
    const label = document.createElement('label');
    label.className = 'option';
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = q.id;
    input.value = opt.value;
    if (opt.value === q.recommended) input.checked = true;
    label.appendChild(input);
    label.append(' ' + opt.label);
    if (opt.value === q.recommended) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '模型推荐';
      label.appendChild(badge);
      const reason = document.createElement('div');
      reason.className = 'reason';
      reason.textContent = q.recommendation_reason;
      label.appendChild(reason);
    }
    card.appendChild(label);
  }

  const uncertain = document.createElement('label');
  uncertain.className = 'option';
  uncertain.innerHTML = `<input type="radio" name="${q.id}" value="__uncertain__"> 不确定`;
  card.appendChild(uncertain);

  const custom = document.createElement('label');
  custom.className = 'option';
  custom.innerHTML = `<input type="radio" name="${q.id}" value="__custom__"> 其他想法<textarea data-custom-for="${q.id}" placeholder="直接写你希望发生什么"></textarea>`;
  const area = custom.querySelector('textarea');
  area.addEventListener('focus', () => custom.querySelector('input').checked = true);
  card.appendChild(custom);
  form.appendChild(card);
}

function buildPayload() {
  const decisions = QUESTIONNAIRE.questions.map(q => {
    const selected = form.querySelector(`input[name="${q.id}"]:checked`);
    const raw = selected ? selected.value : q.recommended;
    if (raw === '__uncertain__') return { id: q.id, status: 'uncertain', recommended: q.recommended, answer: null };
    if (raw === '__custom__') {
      const answer = form.querySelector(`[data-custom-for="${q.id}"]`).value.trim();
      return { id: q.id, status: 'custom', recommended: q.recommended, answer };
    }
    return {
      id: q.id,
      status: raw === q.recommended ? 'default_accepted' : 'overridden',
      recommended: q.recommended,
      answer: raw
    };
  });
  return { questionnaire_id: QUESTIONNAIRE.id, submitted_at: new Date().toISOString(), decisions };
}

document.getElementById('submit').addEventListener('click', async () => {
  const payload = buildPayload();
  const result = document.getElementById('result');
  result.style.display = 'block';
  result.textContent = JSON.stringify(payload, null, 2);

  // Harness integration points.
  window.dispatchEvent(new CustomEvent('decision-questionnaire-submit', { detail: payload }));
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'decision-questionnaire-submit', payload }, '*');
  }

  try { await navigator.clipboard.writeText(JSON.stringify(payload, null, 2)); } catch (_) {}
});
</script>
</body>
</html>
